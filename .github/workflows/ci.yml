name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A clean run takes a few minutes; a hung test must not hold a runner for the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build FrameMotionPlus.slnx -c Release

      - name: Test
        run: dotnet test FrameMotionPlus.slnx -c Release --no-build

  native-aot:
    name: NativeAOT publish (linux-x64)
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Publish
        run: dotnet publish src/FrameMotionPlus.App -c Release -r linux-x64

      - name: Smoke test the native binary
        run: |
          fmp=artifacts/publish/FrameMotionPlus.App/release_linux-x64/fmp
          "$fmp" --version
          "$fmp" simulate --source-fps 60 --display-hz 120 --duration-s 30 --check
          "$fmp" simulate --source-fps 30 --display-hz 120 --duration-s 30 --check
          "$fmp" simulate --source-fps 59.94 --display-hz 120 --duration-s 30 --check
          "$fmp" simulate --source-fps 60 --display-hz 120 --clock vrr --duration-s 30 --check
          "$fmp" settings > /dev/null
